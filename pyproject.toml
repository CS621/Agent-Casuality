[project]
name = "agent-casuality"
version = "0.1.0"
description = "Causal capture SDK for branching multi-agent systems"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
explain = ["httpx>=0.27.0"]
all = ["psycopg[binary]>=3.2.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["casuality*", "cli*", "core*", "sdk*", "storage*"]

[project.scripts]
casuality = "cli.main:main"
agent-casuality = "cli.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires a reachable PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["fixture"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
root = ["."]
